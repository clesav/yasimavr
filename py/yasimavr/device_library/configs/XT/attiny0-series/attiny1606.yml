---
name: attiny1606

inherits: attiny-0series-himem

memory:
    data:
        io: [0x000, 0x13FF]
        eeprom: [0x1400, 0x14FF]
        ram: [ 0x3C00, 0x3FFF]
        flash: [0x8000, 0xBFFF]
    ram:
        size: 1024
    flash:
        size: 16384
        page_size: 64
    eeprom:
        size: 256
        page_size: 32
    userrow:
        size: 32

device_signature: [ 0x1E, 0x94, 0x24 ]

pins: [ PA0, PA1, PA2, PA3, PA4, PA5, PA6, PA7,
        PB0, PB1, PB2, PB3, PB4, PB5,
        PC0, PC1, PC2, PC3 ]

peripheral:
    ADC0:
        class: ADC
        file: XT/ArchXT_analog.yml
        base: 0x0600
        config:
            channels:
                0x00: [ SingleEnded, PA0 ]
                0x01: [ SingleEnded, PA1 ]
                0x02: [ SingleEnded, PA2 ]
                0x03: [ SingleEnded, PA3 ]
                0x04: [ SingleEnded, PA4 ]
                0x05: [ SingleEnded, PA5 ]
                0x06: [ SingleEnded, PA6 ]
                0x07: [ SingleEnded, PA7 ]
                0x08: [ SingleEnded, PB5 ]
                0x09: [ SingleEnded, PB4 ]
                0x0A: [ SingleEnded, PB1 ]
                0x0B: [ SingleEnded, PB0 ]
                0x1D: IntRef
                0x1E: Temperature
                0x1F: Zero
            vref_channel: 0

    ACP0:
        class: ACP
        file: XT/ArchXT_analog.yml
        base: 0x0680
        config:
            pos_channels:
                0x0: [ Pin, PA7 ]
                0x1: [ Pin, PB5 ]
            neg_channels:
                0x0: [ Pin, PA6 ]
                0x1: [ Pin, PB4 ]
                0x2: [ IntRef ]
            vref_channel: 1
            iv_cmp: AC0

iomux:
    TCA0:
        DLFT: [ PB0, PB1, PB2, PA3, PA4, PA5 ]
        ALT:  [ PB3, PB4, PB5, PC3, "",  ""  ]

    TCB0:
        DFLT: [ PA5 ]
        ALT:  [ PC0 ]

    USART0:
        #TXD, RXD, XCK, XDIR
        DFLT: [ PB2, PB3, PB1, PB0 ]
        ALT:  [ PA1, PA2, PA3, PA4 ]

    SPI0:
        #SCK, MISO, MOSI, CS
        DFLT: [ PA3, PA2, PA1, PA4 ]
        ALT:  [ PC0, PC1, PC2, PC3 ]

    TWI0:
        #SCK, SDA
        DFLT: [ PB0, PB1 ]
