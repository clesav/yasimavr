#This file contains the common configuration keys for attiny-0series models
#(attiny202/204/402/404/804/806/807/1604/1606/1607)


---
architecture: XT

core:
    extended_addressing: no
    clear_GIE_on_int: no

fuses:
    size: 11
    factory_values: [ 0x00, 0x00, 0x02, 0x00, 0x00,
                      0xF6, 0x07, 0x00, 0x00, 0x00,
                      0xC5 ]

access:
    lsb_first_on_write: yes
    lsb_first_on_read: yes

peripherals:
    CPU:
        file: XT/ArchXT_controllers.yml

    CPUINT:
        file: XT/ArchXT_controllers.yml
        base: 0x0110

    SLPCTRL:
        file: XT/ArchXT_controllers.yml
        base: 0x0050

    RSTCTRL:
        file: XT/ArchXT_controllers.yml
        base: 0x0040

    CLKCTRL:
        file: XT/ArchXT_controllers.yml
        base: 0x0060

    NVMCTRL:
        file: XT/ArchXT_controllers.yml
        base: 0x1000
        config:
           iv_eeready: NVMCTRL_EE

    MISC:
        file: XT/ArchXT_controllers.yml

    PORTA:
        class: PORT
        file: XT/ArchXT_interfaces.yml
        base: 0x0400
        config:
            reg_base_port: 0x0400
            reg_base_vport: 0x0000
            iv_port: PORTA

    TCA0:
        class: TCA
        file: XT/ArchXT_timers.yml
        base: 0x0A00
        config:
            iv_ovf: TCA0_OVF
            iv_hunf: TCA0_HUNF
            ivs_cmp: [ TCA0_CMP0, TCA0_CMP1, TCA0_CMP2 ]
            version: V1

    TCB0:
        class: TCB
        file: XT/ArchXT_timers.yml
        base: 0x0A40
        config:
            iv_capt: TCB0

    RTC:
        file: XT/ArchXT_timers.yml
        base: 0x0140
        config:
            iv_rtc: RTC_CNT
            iv_pit: RTC_PIT

    WDT:
        file: XT/ArchXT_timers.yml
        base: 0x0100

    VREF:
        class: VREF
        file: XT/ArchXT_analog.yml
        base: 0x00A0
        config:
            channels:
                - rb_select: CTRLA/ADC0REFSEL
                  references: [ 0.55, 1.1, 2.5, 4.3, 1.5 ]

                - rb_select: CTRLA/AC0REFSEL
                  references: [ 0.55, 1.1, 2.5, 4.3, 1.5 ]

    USART0:
        class: USART
        file: XT/ArchXT_interfaces.yml
        base: 0x0800
        config:
            iv_rxc: USART0_RXC
            iv_txc: USART0_TXC
            iv_txe: USART0_DRE

    SPI0:
        class: SPI
        file: XT/ArchXT_interfaces.yml
        base: 0x0820
        config:
            iv_spi: SPI0

    TWI0:
        class: TWI
        file: XT/ArchXT_interfaces.yml
        base: 0x0810
        config:
            iv_host: TWI0_TWIM
            iv_client: TWI0_TWIS
            dual_ctrl: false

    PORTMUX:
        class: PORTMUX_tiny0
        file: XT/ArchXT_interfaces.yml
        base: 0x0200

    FUSES:
        file: XT/ArchXT_controllers.yml
        base: 0x1280

    USERROW:
        class: USERROW_32
        file: XT/ArchXT_controllers.yml
        base: 0x1300
