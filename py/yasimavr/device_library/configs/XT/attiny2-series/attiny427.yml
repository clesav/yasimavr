---
name: attiny427

inherits: attiny-2series-lomem

memory:
    data:
        io: [0x000, 0x13FF]
        eeprom: [0x1400, 0x147F]
        ram: [ 0x3E00, 0x3FFF]
        flash: [0x8000, 0x8FFF]
    ram:
        size: 512
    flash:
        size: 4096
        page_size: 64
    eeprom:
        size: 128
        page_size: 32
    userrow:
        size: 32

device_signature: [ 0x1E, 0x92, 0x2A ]

pins: [ PA0, PA1, PA2, PA3, PA4, PA5, PA6, PA7,
        PB0, PB1, PB2, PB3, PB4, PB5, PB6, PB7,
        PC0, PC1, PC2, PC3, PC4, PC5 ]

peripherals:
    PORTC:
        class: PORT
        file: XT/ArchXT_interfaces.yml
        base: 0x0440
        config:
            reg_base_port: 0x0440
            reg_base_vport: 0x0008
            iv_port: PORTC

    USERROW:
        class: USERROW_32
        file: XT/ArchXT_controllers.yml
        base: 0x1300
