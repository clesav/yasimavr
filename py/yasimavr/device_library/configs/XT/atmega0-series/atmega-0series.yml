#This file contains the common configuration keys for atmega-0series models
#(atmega808/809/1608/1609/3208/3209/4808/4809)

---
architecture: XT

core:
    extended_addressing: no
    clear_GIE_on_int: no

fuses:
    size: 11
    factory_values: [ 0x00, 0x00, 0x02, 0x00, 0x00,
                      0xC0, 0x07, 0x00, 0x00, 0x00,
                      0xC5 ]

access:
    lsb_first_on_write: yes
    lsb_first_on_read: yes

peripherals:
    CPU:
        file: XT/ArchXT_controllers.yml

    CPUINT:
        file: XT/ArchXT_controllers.yml
        base: 0x0110

    SLPCTRL:
        file: XT/ArchXT_controllers.yml
        base: 0x0050

    RSTCTRL:
        file: XT/ArchXT_controllers.yml
        base: 0x0040

    CLKCTRL:
        file: XT/ArchXT_controllers.yml
        base: 0x0060

    NVMCTRL:
        file: XT/ArchXT_controllers.yml
        base: 0x1000
        config:
           iv_eeready: NVMCTRL_EE

    MISC:
        file: XT/ArchXT_controllers.yml

    PORTA:
        class: PORT
        file: XT/ArchXT_interfaces.yml
        base: 0x0400
        config:
            reg_base_port: 0x0400
            reg_base_vport: 0x0000
            iv_port: PORTA

    #PORTB for xx09 variants only

    PORTC:
        class: PORT
        file: XT/ArchXT_interfaces.yml
        base: 0x0440
        config:
            reg_base_port: 0x0440
            reg_base_vport: 0x0008
            iv_port: PORTC

    PORTD:
        class: PORT
        file: XT/ArchXT_interfaces.yml
        base: 0x0460
        config:
            reg_base_port: 0x0460
            reg_base_vport: 0x000C
            iv_port: PORTD

    #PORTE for xx09 variants only

    PORTF:
        class: PORT
        file: XT/ArchXT_interfaces.yml
        base: 0x04A0
        config:
            reg_base_port: 0x04A0
            reg_base_vport: 0x0014
            iv_port: PORTF

    TCA0:
        class: TCA
        file: XT/ArchXT_timers.yml
        base: 0x0A00
        config:
            iv_ovf: TCA0_OVF
            iv_hunf: TCA0_HUNF
            ivs_cmp: [ TCA0_CMP0, TCA0_CMP1, TCA0_CMP2 ]
            version: V1

    TCB0:
        class: TCB
        file: XT/ArchXT_timers.yml
        base: 0x0A80
        config:
            iv_capt: TCB0

    TCB1:
        class: TCB
        file: XT/ArchXT_timers.yml
        base: 0x0A90
        config:
            iv_capt: TCB1

    TCB2:
        class: TCB
        file: XT/ArchXT_timers.yml
        base: 0x0AA0
        config:
            iv_capt: TCB2

    #TCB3 for xx09 variants only

    RTC:
        file: XT/ArchXT_timers.yml
        base: 0x0140
        config:
            iv_rtc: RTC_CNT
            iv_pit: RTC_PIT

    WDT:
        file: XT/ArchXT_timers.yml
        base: 0x0100

    VREF:
        class: VREF
        file: XT/ArchXT_analog.yml
        base: 0x00A0
        config:
            channels:
                - rb_select: CTRLA/ADC0REFSEL
                  references: [ 0.55, 1.1, 2.5, 4.3, 1.5 ]

                - rb_select: CTRLA/AC0REFSEL
                  references: [ 0.55, 1.1, 2.5, 4.3, 1.5, null, null, AVCC ]

    ACP0:
        class: ACP
        file: XT/ArchXT_analog.yml
        base: 0x0680
        config:
            pos_channels:
                0x0: [ Pin, PD2 ]
                0x1: [ Pin, PD4 ]
                0x2: [ Pin, PD6 ]
                0x3: [ Pin, PD1 ]
            neg_channels:
                0x0: [ Pin, PD3 ]
                0x1: [ Pin, PD5 ]
                0x2: [ Pin, PD7 ]
                0x3: [ AcompRef ]
            vref_channel: 1
            iv_cmp: AC0

    USART0:
        class: USART
        file: XT/ArchXT_interfaces.yml
        base: 0x0800
        config:
            iv_rxc: USART0_RXC
            iv_txc: USART0_TXC
            iv_txe: USART0_DRE

    USART1:
        class: USART
        file: XT/ArchXT_interfaces.yml
        base: 0x0820
        config:
            iv_rxc: USART1_RXC
            iv_txc: USART1_TXC
            iv_txe: USART1_DRE

    USART2:
        class: USART
        file: XT/ArchXT_interfaces.yml
        base: 0x0840
        config:
            iv_rxc: USART2_RXC
            iv_txc: USART2_TXC
            iv_txe: USART2_DRE

    #USART3 for xx09 variants only

    SPI0:
        class: SPI
        file: XT/ArchXT_interfaces.yml
        base: 0x08C0
        config:
            iv_spi: SPI0

    TWI0:
        class: TWI
        file: XT/ArchXT_interfaces.yml
        base: 0x08A0
        config:
            iv_host: TWI0_TWIM
            iv_client: TWI0_TWIS
            dual_ctrl: true

    PORTMUX:
        class: PORTMUX_mega0
        file: XT/ArchXT_interfaces.yml
        base: 0x05E0

    FUSES:
        file: XT/ArchXT_controllers.yml
        base: 0x1280
