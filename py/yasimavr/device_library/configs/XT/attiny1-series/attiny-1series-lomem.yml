#This file contains the common configuration keys for attiny-1series models
#with flash mem <= 8kb and single word IVT


---
inherits: attiny-1series

interrupts:
    vector_size: 2

    vectors:
        - RESET
        - CRCSCAN
        - BOD
        - PORTA
        - PORTB
        - PORTC
        - RTC_CNT
        - RTC_PIT
        - TCA0_OVF
        - TCA0_HUNF
        - TCA0_CMP0
        - TCA0_CMP1
        - TCA0_CMP2
        - TCB0
        - TCD0_OVF
        - TCD0_TRIG
        - AC0
        - ADC0_RESRDY
        - ADC0_WCOMP
        - TWI0_TWIS
        - TWI0_TWIM
        - SPI0
        - USART0_RXC
        - USART0_DRE
        - USART0_TXC
        - NVMCTRL_EE

    sleep_mask:
        Idle:       [ 0xFF, 0xFF, 0xFF, 0x03 ]
        Standby:    [ 0xFF, 0x20, 0x4E, 0x00 ]
        PowerDown:  [ 0xBF, 0x00, 0x08, 0x00 ]

peripherals:
    PORTB:
        class: PORT
        file: XT/ArchXT_interfaces.yml
        base: 0x0420
        config:
            reg_base_port: 0x0420
            reg_base_vport: 0x0004
            iv_port: PORTB
