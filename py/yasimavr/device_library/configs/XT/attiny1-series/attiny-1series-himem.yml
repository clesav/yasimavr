#This file contains the common configuration keys for attiny-1series models
#with flash mem > 8kb and double word IVT


---
inherits: attiny-1series

interrupts:
    vector_size: 4

    vectors:
        - RESET
        - CRCSCAN
        - BOD
        - PORTA
        - PORTB
        - PORTC
        - RTC_CNT
        - RTC_PIT
        - TCA0_OVF
        - TCA0_HUNF
        - TCA0_CMP0
        - TCA0_CMP1
        - TCA0_CMP2
        - TCB0
        - TCB1
        - TCD0_OVF
        - TCD0_TRIG
        - AC0
        - AC1
        - AC2
        - ADC0_RESRDY
        - ADC0_WCOMP
        - ADC1_RESRDY
        - ADC1_WCOMP
        - TWI0_TWIS
        - TWI0_TWIM
        - SPI0
        - USART0_RXC
        - USART0_DRE
        - USART0_TXC
        - NVMCTRL_EE

    sleep_mask:
        Idle:       [ 0xFF, 0xFF, 0xFF, 0x3F ]
        Standby:    [ 0xFF, 0x60, 0xF0, 0x05 ]
        PowerDown:  [ 0xBF, 0x00, 0x00, 0x01 ]

peripherals:
    PORTB:
        class: PORT
        file: XT/ArchXT_interfaces.yml
        base: 0x0420
        config:
            reg_base_port: 0x0420
            reg_base_vport: 0x0004
            iv_port: PORTB

    TCB1:
        class: TCB
        file: XT/ArchXT_timers.yml
        base: 0x0A50
        config:
            iv_capt: TCB1

    ADC0:
        class: ADC
        file: XT/ArchXT_analog.yml
        base: 0x0600
        config:
            channels:
                0x00: [ SingleEnded, PA0 ]
                0x01: [ SingleEnded, PA1 ]
                0x02: [ SingleEnded, PA2 ]
                0x03: [ SingleEnded, PA3 ]
                0x04: [ SingleEnded, PA4 ]
                0x05: [ SingleEnded, PA5 ]
                0x06: [ SingleEnded, PA6 ]
                0x07: [ SingleEnded, PA7 ]
                0x08: [ SingleEnded, PB5 ]
                0x09: [ SingleEnded, PB4 ]
                0x0A: [ SingleEnded, PB1 ]
                0x0B: [ SingleEnded, PB0 ]
                0x1C: [ DAC, 0 ]
                0x1D: IntRef
                0x1E: Temperature
                0x1F: Zero
            vref_channel: 0

    ADC1:
        class: ADC
        file: XT/ArchXT_analog.yml
        base: 0x0640
        config:
            channels:
                0x00: [ SingleEnded, PA4 ]
                0x01: [ SingleEnded, PA5 ]
                0x02: [ SingleEnded, PA6 ]
                0x03: [ SingleEnded, PA7 ]
                0x04: [ SingleEnded, PB7 ]
                0x05: [ SingleEnded, PB6 ]
                0x06: [ SingleEnded, PC0 ]
                0x07: [ SingleEnded, PC1 ]
                0x08: [ SingleEnded, PC2 ]
                0x09: [ SingleEnded, PC3 ]
                0x0A: [ SingleEnded, PC4 ]
                0x0B: [ SingleEnded, PC5 ]
                0x1B: [ DAC, 2 ]
                0x1C: [ DAC, 0 ]
                0x1D: IntRef
                0x1E: [ DAC, 1 ]
                0x1F: Zero
            vref_channel: 2

    ACP0:
        class: ACP
        file: XT/ArchXT_analog.yml
        base: 0x0680
        config:
            pos_channels:
                0x0: [ Pin, PA7 ]
                0x1: [ Pin, PB5 ]
                0x2: [ Pin, PB1 ]
                0x3: [ Pin, PB6 ]
            neg_channels:
                0x0: [ Pin, PA6 ]
                0x1: [ Pin, PB4 ]
                0x2: [ IntRef ]
                0x3: [ DAC, 0 ]
            vref_channel: 1
            iv_cmp: AC0

    ACP1:
        class: ACP
        file: XT/ArchXT_analog.yml
        base: 0x0688
        config:
            pos_channels:
                0x0: [ Pin, PA7 ]
                0x1: [ Pin, PA6 ]
                0x2: [ Pin, PB0 ]
                0x3: [ Pin, PB4 ]
            neg_channels:
                0x0: [ Pin, PA5 ]
                0x1: [ Pin, PB7 ]
                0x2: [ IntRef ]
                0x3: [ DAC, 1 ]
            vref_channel: 3
            iv_cmp: AC1

    ACP2:
        class: ACP
        file: XT/ArchXT_analog.yml
        base: 0x0690
        config:
            pos_channels:
                0x0: [ Pin, PA6 ]
                0x1: [ Pin, PB0 ]
                0x2: [ Pin, PB5 ]
                0x3: [ Pin, PB7 ]
            neg_channels:
                0x0: [ Pin, PA7 ]
                0x1: [ Pin, PB6 ]
                0x2: [ IntRef ]
                0x3: [ DAC, 2 ]
            vref_channel: 4
            iv_cmp: AC2

    DAC1:
        class: DAC
        file: XT/ArchXT_analog.yml
        base: 0x06A8
        config:
            vref_channel: 3

    DAC2:
        class: DAC
        file: XT/ArchXT_analog.yml
        base: 0x06B0
        config:
            vref_channel: 4

iomux:
    TCA00:
        DFLT: [ PB0 ]
        ALT : [ PB3 ]

    TCA01:
        DFLT: [ PB1 ]
        ALT : [ PB4 ]

    TCA02:
        DFLT: [ PB2 ]
        ALT : [ PB6 ]

    TCA03:
        DFLT: [ PA3 ]
        ALT : [ PC3 ]

    TCA04:
        DFLT: [ PA4 ]
        ALT : [ PC4 ]

    TCA05:
        DFLT: [ PA5 ]
        ALT : [ PC5 ]

    TCB0:
        DFLT: [ PA5 ]
        ALT : [ PC0 ]

    TCB1:
        DFLT: [ PA3 ]
        ALT : [ PC4 ]

    USART0:
        #TXD, RXD, XCK, XDIR
        DFLT: [ PB2, PB3, PB1, PB0 ]
        ALT : [ PA1, PA2, PA3, PA4 ]

    SPI0:
        #SCK, MISO, MOSI, CS
        DFLT: [ PA3, PA2, PA1, PA4 ]
        ALT : [ PC0, PC1, PC2, PC3 ]

    TWI0:
        #SCL, SDA
        DFLT: [ PB0, PB1 ]
        ALT : [ PA2, PA1 ]
