#This file contains the common configuration keys for attiny-1series models
#with flash mem <= 8kb and single word IVT and 14/20/24 pins


---
inherits: attiny-1series-lomem

peripherals:
    ADC0:
        class: ADC
        file: XT/ArchXT_analog.yml
        base: 0x0600
        config:
            channels:
                0x00: [ SingleEnded, PA0 ]
                0x01: [ SingleEnded, PA1 ]
                0x02: [ SingleEnded, PA2 ]
                0x03: [ SingleEnded, PA3 ]
                0x04: [ SingleEnded, PA4 ]
                0x05: [ SingleEnded, PA5 ]
                0x06: [ SingleEnded, PA6 ]
                0x07: [ SingleEnded, PA7 ]
                0x08: [ SingleEnded, PB5 ]
                0x09: [ SingleEnded, PB4 ]
                0x0A: [ SingleEnded, PB1 ]
                0x0B: [ SingleEnded, PB0 ]
                0x1C: [ DAC, 0 ]
                0x1D: IntRef
                0x1E: Temperature
                0x1F: Zero
            vref_channel: 0

    ACP0:
        class: ACP
        file: XT/ArchXT_analog.yml
        base: 0x0680
        config:
            pos_channels:
                0x0: [ Pin, PA7 ]
                0x1: [ Pin, PB5 ]
            neg_channels:
                0x0: [ Pin, PA6 ]
                0x1: [ Pin, PB4 ]
                0x2: [ IntRef ]
                0x3: [ DAC, 0 ]
            vref_channel: 1
            iv_cmp: AC0

iomux:
    TCA00:
        DFLT: [ PB0 ]
        ALT : [ PB3 ]

    TCA01:
        DFLT: [ PB1 ]
        ALT : [ PB4 ]

    TCA02:
        DFLT: [ PB2 ]
        ALT : [ PB5 ]

    TCA03:
        DFLT: [ PA3 ]
        ALT : [ PC3 ]

    TCA04:
        DFLT: [ PA4 ]
        ALT : [ PC4 ]

    TCA05:
        DFLT: [ PA5 ]
        ALT : [ PC5 ]

    TCB0:
        DFLT: [ PA5 ]
        ALT : [ PC0 ]

    USART0:
        #TXD, RXD, XCK, XDIR
        DFLT: [ PB2, PB3, PB1, PB0 ]
        ALT : [ PA1, PA2, PA3, PA4 ]

    SPI0:
        #SCK, MISO, MOSI, CS
        DFLT: [ PA3, PA2, PA1, PA4 ]
        ALT : [ PC0, PC1, PC2, PC3 ]

    TWI0:
        #SCL, SDA
        DFLT: [ PB0, PB1 ]
        ALT : [ PA2, PA1 ]
