---
name: attiny214

inherits: attiny-1series-lomem-14_20_24pins

memory:
    data:
        io: [0x000, 0x13FF]
        eeprom: [0x1400, 0x143F]
        ram: [ 0x3F80, 0x3FFF]
        flash: [0x8000, 0x87FF]
    ram:
        size: 128
    flash:
        size: 2048
        page_size: 64
    eeprom:
        size: 64
        page_size: 32
    userrow:
        size: 32

device_signature: [ 0x1E, 0x91, 0x20 ]

pins: [ PA0, PA1, PA2, PA3, PA4, PA5, PA6, PA7,
        PB0, PB1, PB2, PB3 ]

peripherals:
    USERROW:
        class: USERROW_32
        file: XT/ArchXT_controllers.yml
        base: 0x1300
