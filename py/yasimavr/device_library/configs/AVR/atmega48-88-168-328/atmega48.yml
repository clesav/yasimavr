---
name: atmega48

inherits: atmegaxx8

memory:
    data:
        regfile: [0x000, 0x01F]
        io: [0x020, 0x0FF]
        ram: [0x100, 0x2FF]
    ram:
        size: 512
    flash:
        size: 4096
        page_size: 64
    eeprom:
        size: 256

fuses:
    size: 3
    factory_values: [ 0x62, 0xDF, 0xFF ]
    lock_byte: 0xFF

device_signature: [ 0x1E, 0x92, 0x05 ]

pins: [ PB0, PB1, PB2, PB3, PB4, PB5, PB6, PB7,
        PC0, PC1, PC2, PC3, PC4, PC5,
        PD0, PD1, PD2, PD3, PD4, PD5, PD6, PD7,
        ADC6, ADC7 ]

interrupts:
    vector_size: 2

    vectors:
        - RESET
        - INT0
        - INT1
        - PCINT0
        - PCINT1
        - PCINT2
        - WDT
        - TIMER2_COMPA
        - TIMER2_COMPB
        - TIMER2_OVF
        - TIMER1_CAPT
        - TIMER1_COMPA
        - TIMER1_COMPB
        - TIMER1_OVF
        - TIMER0_COMPA
        - TIMER0_COMPB
        - TIMER0_OVF
        - SPI_STC
        - USART_RX
        - USART_UDRE
        - USART_TX
        - ADC
        - EE_READY
        - ANALOG_COMP
        - TWI
        - SPM_READY

    sleep_mask:
        Idle:         [ 0xFF, 0xFF, 0xFF, 0x03 ]
        ADC:          [ 0xFF, 0x03, 0xE0, 0x03 ]
        PowerDown:    [ 0x7F, 0x00, 0x00, 0x01 ]
        PowerSave:    [ 0xFF, 0x03, 0x00, 0x01 ]
        Standby:      [ 0x7F, 0x00, 0x00, 0x01 ]
        ExtStandby:   [ 0xFF, 0x03, 0x00, 0x01 ]

peripherals:
    FUSES:
        class: FUSES_48
        file: mega48-88-168-328_controllers.yml
