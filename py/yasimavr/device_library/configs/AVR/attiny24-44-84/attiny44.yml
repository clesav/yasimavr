---
name: attiny44

inherits: attinyx4

memory:
    data:
        regfile: [0x000, 0x01F]
        io: [0x020, 0x05F]
        ram: [0x060, 0x15F]
    ram:
        size: 256
    flash:
        size: 4096
        page_size: 64
    eeprom:
        size: 256

device_signature: [ 0x1E, 0x92, 0x07 ]
